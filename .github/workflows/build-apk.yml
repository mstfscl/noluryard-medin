name: Build APK

on:
  push:
    branches:
      - "claude/**"
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Print environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -euo pipefail
          ls -la out/
          APK=out/autoclicker.apk
          SIZE=$(du -h "$APK" | cut -f1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -5
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" || true
          {
            echo "## APK hazır"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Dosya | \`out/autoclicker.apk\` |"
            echo "| Boyut | $SIZE |"
            echo "| SHA-256 | \`$SHA\` |"
            echo ""
            echo "Kurulum: \`adb install -r autoclicker.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-apk
          path: out/autoclicker.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
